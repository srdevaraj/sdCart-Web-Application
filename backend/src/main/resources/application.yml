spring:
  application:
    name: sdcart-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # DATABASE_URL is the canonical override (used by docker compose). When it
    # is not set, the URL is composed from DB_HOST/DB_PORT/DB_NAME — which is
    # how Render's managed Postgres is wired (see render.yaml).
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sdcart}}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    hikari:
      pool-name: SdCartHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  # Render injects $PORT for web services; SERVER_PORT remains the override
  # for docker compose and local development.
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

app:
  jwt:
    # Local development default only. In production JWT_SECRET must be a
    # random string of at least 32 bytes (see .env.example).
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789abcdef}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  admin:
    email: ${ADMIN_EMAIL:admin@sdcart.com}
    password: ${ADMIN_PASSWORD:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  email:
    provider: ${EMAIL_PROVIDER:console}
    from: ${EMAIL_FROM:no-reply@sdcart.com}
    smtp-host: ${SMTP_HOST:}
    smtp-port: ${SMTP_PORT:587}
    smtp-username: ${SMTP_USERNAME:}
    smtp-password: ${SMTP_PASSWORD:}
  security:
    # Per-IP fixed-window rate limit on /api/v1/auth/* (brute-force protection).
    # Single-instance limiter; disable when a shared limiter/WAF is in front.
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      per-minute: ${RATE_LIMIT_PER_MINUTE:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.sdcart: INFO
