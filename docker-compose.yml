# ============================================================================
# sdCart — full local stack: PostgreSQL + Spring Boot backend + React frontend
#
#   docker compose up --build
#
#   Frontend : http://localhost:3000
#   Backend  : http://localhost:8080  (Swagger UI: /swagger-ui.html, health: /actuator/health)
#   Database : localhost:5432 (sdcart / postgres)
#
# ⚠️  Credentials below are LOCAL DEFAULTS only. Production (Render) uses its
#     own managed database credentials and generated JWT secret — see
#     render.yaml and README.md. Never reuse postgres/password in production.
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: sdcart-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sdcart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - sdcart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sdcart"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sdcart-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      # Service name "db" resolves via Docker's internal DNS.
      DATABASE_URL: jdbc:postgresql://db:5432/sdcart
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789abcdef}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sdcart.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time API URL baked into the Vite bundle. For the local stack
        # the browser reaches the backend on the published host port.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: sdcart-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  sdcart_pgdata:
