# sdCart frontend — Nginx configuration
# Serves the Vite production build with React Router SPA fallback, gzip
# compression, immutable caching for hashed assets, and basic security headers.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/html
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---- Security headers --------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- Health check (Render, docker compose) -----------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---- Hashed build assets: cache forever --------------------------------
    # Vite emits content-hashed filenames (assets/index-<hash>.js), so an
    # immutable long cache is safe and keeps repeat loads fast.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback ------------------------------------------------------
    # index.html is never cached so new deployments are picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The add_header directives must be repeated here: nginx does not inherit
    # server-level add_header into a location that declares its own, so the
    # security headers would otherwise be missing from every HTML response
    # (index.html and all SPA-fallback routes).
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
